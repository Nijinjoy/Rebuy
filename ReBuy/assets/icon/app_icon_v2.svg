  <path d="M480 450 V740"/>
  <path d="M480 450 H580 a80 80 0 0 1 0 160 H480"/>
  <path d="M562 612 L650 718"/>
</g>
<path d="M700 778 L610 750 L688 684 Z" fill="url(#ink)" stroke="url(#ink)" stroke-width="22" stroke-linejoin="round"/>
</svg>
