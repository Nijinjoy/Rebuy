<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFB547"/>
    <stop offset="0.45" stop-color="#FF5E62"/>
    <stop offset="1" stop-color="#7B2FF7"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.25" cy="0.15" r="0.7">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="440" y1="420" x2="720" y2="780">
    <stop offset="0" stop-color="#FF6A3D"/><stop offset="1" stop-color="#8A2BE2"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3A0A5E" flood-opacity="0.4"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#glow)"/>
<circle cx="860" cy="170" r="190" fill="#FFFFFF" opacity="0.08"/>
<circle cx="140" cy="900" r="240" fill="#FFFFFF" opacity="0.06"/>
<!-- tag -->
<g transform="translate(540 540) rotate(45)" filter="url(#sh)">
  <path d="M-170 -250 H250 a60 60 0 0 1 60 60 V190 a60 60 0 0 1 -60 60 H-170 a40 40 0 0 1 -28 -12 L-360 34 a48 48 0 0 1 0 -68 L-198 -238 a40 40 0 0 1 28 -12 Z" fill="#FFFFFF"/>
  <circle cx="-250" cy="0" r="34" fill="url(#bg)"/>
</g>
<!-- string loop through the hole -->
<path d="M364 364 C 300 300, 250 250, 210 190 C 180 140, 230 110, 260 150" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
<!-- R with arrow leg -->
